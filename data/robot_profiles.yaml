        tau_max: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]
        kp_p: 900.0
        kd_p: 90.0
        ki_p: 600.0
        kp_o: 18.0
        kd_o: 1.8
        fmax: 60.0
        mmax: 15.0
        ierr_clip: 0.05
      abb_irb2400:
        arm_pattern: "*irb2400*"
        home: [0.0, 0.4, 0.95, 0.0, 1.79, 0.0]
        tau_max: [400.0, 800.0, 400.0, 60.0, 40.0, 28.0]
        kp_p: 1400.0
        kd_p: 300.0
        ki_p: 900.0
        kp_o: 120.0
        kd_o: 8.0
        fmax: 400.0
        mmax: 40.0
        ierr_clip: 0.15
    coverage:
      fanuc_m10ia: missing       # no HOME/TAU branch; arm_pat falls through to *iiwa* (wrong pattern)
      motoman_gp12: missing
      kuka_lbr_iiwa14_r820: broken_fallback  # an *iiwa* pattern exists but HOME is a 6-vector against NJ=7 (no shape assert)

