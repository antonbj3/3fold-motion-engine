# =============================================================================
# robot_profiles.yaml — the robot-branch constants as DATA
# =============================================================================
# The per-robot values used by the manipulation cells, one block per (script, robot) pair. The values
# under scripts.<script>.robots.<robot> are the EFFECTIVE values after all branches have been applied
# in order; there is no inheritance logic here, deliberately redundant so every (script, robot) cell
# is auditable on its own.
# =============================================================================
meta:
  source: "scripts/newton_{stack,friction_pick,friction_stack,tower,tower5,sort,hybrid_pick,pick_payload,collision_lift}.py"
  robots:
    - ur10e
    - abb_irb2400
    - fanuc_m10ia
    - motoman_gp12
    - kuka_lbr_iiwa14_r820
  # Environment mapping used by the smoke harness.
  # report templates: {seed} = PLANT_SEED, {robot} = robot name.
  env_mapping:
    # scripts/manip_contact_pick.py (bibliotekskonsument av
    manip_contact_pick:
      w_env: PICK_W
      robot_env: ROBOT
      report_ur10e: "contact_pick_s{seed}.json"
      report_other: "contact_pick_{robot}_s{seed}.json"
    # (bibliotekskonsument av scripts.newton_push-cellen nedan; paritet
    # kedjenamnet newton_push.
    manip_push:
      w_env: PUSH_W
      robot_env: ROBOT
      report_ur10e: "push_manipulation.json"          # baseline report name for ur10e
      report_other: "push_{robot}_s{seed}.json"
    newton_stack:
      w_env: PICK_W
      robot_env: ROBOT
      report_ur10e: "stack_s{seed}.json"
      report_other: "stack_{robot}_s{seed}.json"
    newton_friction_pick:
      w_env: FG_W
      robot_env: FG_ROBOT
      report_ur10e: "friction_pick_ur10e_s{seed}.json"   # robotnamn ALLTID med
      report_other: "friction_pick_{robot}_s{seed}.json"
    newton_friction_stack:
      w_env: FG_W
      robot_env: null                                  # ur10e-only, ingen robot-env
      report_ur10e: "friction_stack_s{seed}.json"
      report_other: null
    newton_tower:
      w_env: PICK_W
      robot_env: ROBOT
      report_ur10e: "tower_s{seed}.json"
      report_other: "tower_{robot}_s{seed}.json"
    newton_tower5:
      w_env: PICK_W
      robot_env: ROBOT
      report_ur10e: "tower5_s{seed}.json"
      report_other: "tower5_{robot}_s{seed}.json"
    newton_sort:
      w_env: PICK_W
      robot_env: ROBOT
      report_ur10e: "sort_s{seed}.json"
      report_other: "sort_{robot}_s{seed}.json"
    # Three scripts with no W environment variable (W=256 fixed; argparse --robot/--plant-seed):
    newton_hybrid_pick:    {w_env: null, robot_env: null, report_ur10e: "hybrid_pick_{robot}.json", report_other: "hybrid_pick_{robot}.json"}
    newton_pick_payload:   {w_env: null, robot_env: null, report_ur10e: "pick_payload.json", report_other: null}
    newton_collision_lift: {w_env: null, robot_env: null, report_ur10e: "collision_lift_{robot}.json", report_other: "collision_lift_{robot}.json"}

# =============================================================================
# Effektiva konstanter per (skript, robot).
# Nycklar: arm_pattern (ArticulationView-glob), home (rad, arm-leder),
# tau_max (Nm; friction-skripten inkluderar fingrarnas [200, 200] sist),
# kp_p/kd_p/ki_p (kartesisk positionsloop), kp_o/kd_o (orienteringsloop),
# fmax/mmax (task-space kraft-/momenttak N/Nm), ierr_clip (integralclip m;
# push-abb is a VECTOR [x, y, z]), depth_win (in-jaw depth window, m),
# n_desc (descend-steg), maxk (FSM-stegtak), obj (scen-fixturens kubcentrum),
# settle_park (true = the arm is servo-parked during settling instead of open gravity compensation),
# kp_y/kd_y (wrist-yaw lock, friction_stack only).
# =============================================================================
scripts:

  newton_contact_pick:
    phases: {n_wp: 100, n_desc: 280, n_lift: 110}
    robots:
      ur10e:
        arm_pattern: "*ur10e*"
